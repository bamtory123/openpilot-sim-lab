name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q
      - run: SIMLAB_PYTHON=python bash scripts/verify_portfolio_snapshot.sh
      - run: mkdir -p tests/fixtures/empty-results && python -m simlab.runner report --outputs tests/fixtures/empty-results
