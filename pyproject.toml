[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openpilot-sim-lab"
version = "0.1.0"
description = "Reproducible MetaDrive SIL validation and camera transport-delay experiments for openpilot"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "Pillow>=10.0", "PyYAML>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
simlab = "simlab.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
